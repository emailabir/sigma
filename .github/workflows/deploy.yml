name: Deploy Sigma to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sigma-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Validate login setup and prepare deployment
        id: login
        run: node scripts/prepare-deploy.mjs
        env:
          SIGMA_AUTH_MODE: ${{ vars.SIGMA_AUTH_MODE }}
          SIGMA_FIREBASE_PROJECT_ID: ${{ vars.SIGMA_FIREBASE_PROJECT_ID }}
          SIGMA_FIREBASE_API_KEY: ${{ vars.SIGMA_FIREBASE_API_KEY }}
          SIGMA_BREVO_API_KEY: ${{ secrets.SIGMA_BREVO_API_KEY }}
          SIGMA_EMAIL_FROM: ${{ secrets.SIGMA_EMAIL_FROM }}
      # Secrets are provided only to the deployment step, never the client build.
      - name: Apply schema, deploy, and configure runtime secrets
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c1824afd0aa3057d7540f3355cb262ed
          wranglerVersion: '4.92.0'
          preCommands: npm run db:migrate
          command: deploy --config dist/server/wrangler.json
          secrets: ${{ steps.login.outputs.runtime_secrets }}
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SIGMA_GITHUB_CLIENT_ID: ${{ secrets.SIGMA_GITHUB_CLIENT_ID }}
          SIGMA_GITHUB_CLIENT_SECRET: ${{ secrets.SIGMA_GITHUB_CLIENT_SECRET }}
          SIGMA_BREVO_API_KEY: ${{ secrets.SIGMA_BREVO_API_KEY }}
          SIGMA_EMAIL_FROM: ${{ secrets.SIGMA_EMAIL_FROM }}
          WRANGLER_WRITE_LOGS: 'false'
